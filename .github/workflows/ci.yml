name: Testes e instalador

on:
  push:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (Linux, sem GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar ffmpeg e dependências leves
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements-teste.txt
      - name: Correr testes
        run: python -m pytest -q

  windows:
    name: Instalação real no Windows + Setup.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # Corre o instalador verdadeiro (versão CPU, porque o runner não tem GPU)
      - name: Correr instalar.ps1
        shell: powershell
        run: .\scripts\windows\instalar.ps1 -CPU -SemModelos -SemAtalho

      - name: Verificar bibliotecas e correr testes
        shell: powershell
        run: |
          $env:PATH = "$PWD\tools\ffmpeg\bin;$PWD\tools\deno;$env:PATH"
          $env:PYTHONUTF8 = "1"
          .\.venv\Scripts\python.exe -c "import chatterbox.mtl_tts, demucs.api, silero_vad, yt_dlp, pedalboard; print('bibliotecas ok')"
          if ($LASTEXITCODE) { exit 1 }
          .\tools\uv\uv.exe pip install --python .venv\Scripts\python.exe pytest
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE) { exit 1 }

      - name: Compilar Setup.exe
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc scripts\windows\EstudioVoz.iss
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v6
        with:
          name: EstudioVoz-Setup
          path: saida_instalador/*.exe
          if-no-files-found: error
